services:
  db:
    image: postgres:15.6
    container_name: salon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEV_DB}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - red1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DEV_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: redis_service
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - red1
    restart: always

  app:
    container_name: salon_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
    networks:
      - red1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.salonapp.rule=Host(`saloneventos.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.salonapp.entrypoints=websecure"
      - "traefik.http.routers.salonapp.tls.certresolver=leresolver"
      - "traefik.http.routers.salonapp.priority=100"
      - "traefik.http.routers.salonapp.middlewares=security-headers@docker"
      - "traefik.http.services.salonapp.loadbalancer.server.port=5000"
    volumes:
      - shared_uploads:/home/flaskapp/app/uploads
    restart: unless-stopped

  worker:
    container_name: salon_worker
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
    command: celery -A app.celery_app.celery worker -B --loglevel=info
    networks:
      - red1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - shared_uploads:/home/flaskapp/app/uploads
    restart: unless-stopped

  frontend:
    container_name: salon_frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    networks:
      - red1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`saloneventos.cloud`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=leresolver"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.routers.frontend.middlewares=security-headers@docker,csp-frontend@docker"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Cabeceras de seguridad (las usan también las rutas /api del servicio app)
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Powered-By="
      # CSP en modo Report-Only: no bloquea, sólo avisa en la consola. Pasar a Content-Security-Policy cuando no haya avisos.
      - "traefik.http.middlewares.csp-frontend.headers.customResponseHeaders.Content-Security-Policy-Report-Only=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.de.sentry.io; frame-src https://www.google.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    restart: unless-stopped
    
  traefik:
    image: traefik:v3.7.14
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.leresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.leresolver.acme.email=eulamaxi1@gmail.com"
      - "--certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json"
      # Traefik lee Docker a través del proxy de sólo lectura (ya no monta el socket)
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "traefik_certs:/letsencrypt"
      - "../letsencrypt:/letsencrypt"
    networks:
      - red1
      - socket_proxy
    depends_on:
      - socket-proxy
    restart: always

  # Expone a Traefik sólo la lectura de contenedores y redes; bloquea cualquier escritura en la API de Docker
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket_proxy
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - POST=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    restart: always

networks:
  red1:
    driver: bridge
  # Red interna sin salida a Internet: sólo Traefik y el socket-proxy
  socket_proxy:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  traefik_certs:
  shared_uploads: