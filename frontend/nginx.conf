server {
    listen 80;
    server_name saloneventos.cloud;

    # No revelar la versión de Nginx
    server_tokens off;

    root /usr/share/nginx/html;

    # Archivos de Vite con hash en el nombre: se pueden cachear "para siempre"
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html siempre se revalida para que los despliegues se vean al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
